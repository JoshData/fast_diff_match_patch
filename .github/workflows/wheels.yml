# See https://github.com/pypa/cibuildwheel.

name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel]

    steps:
      - uses: actions/checkout@v6

      - name: Checkout diff-match-patch-cpp-stl submodule
        run: git submodule update --init

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.3.2

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_TEST_COMMAND: "python -m unittest discover {project}/tests"
          CIBW_ARCHS_MACOS: "x86_64 universal2 arm64"
          CIBW_ARCHS_LINUX: "auto64 auto32"
          CIBW_ARCHS_WINDOWS: "auto"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # Build the source distribution under Linux
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Checkout diff-match-patch-cpp-stl submodule
        run: git submodule update --init

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build source distribution
        run: |
          pip install setuptools twine
          python setup.py sdist
          # Check whether the source distribution will render correctly
          twine check dist/*.tar.gz

      - name: Test source distribution
        run: |
          pip install ./dist/*.tar.gz
          python -c "from fast_diff_match_patch import diff"

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ./dist/*.tar.gz
